[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-manus"
version = "0.1.0"
description = "Local-first, India-market research and paper-trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
local-ui = [
  "streamlit>=1.38",
  "pandas>=2.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Existing repository-wide modernization debt is tracked separately from this gate.
# New and changed code still receives the full actionable error families below.
ignore = ["E501", "I001", "UP017", "UP035", "UP037", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
